<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game CAPTCHA</title>
  <link rel="stylesheet" href="../lib/game-captcha.css" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 18px; background: #fff; color: #171717; font: 12px/1.5 "Fusion Pixel", monospace; }
    h1 { font-size: 24px; font-weight: 400; margin: 0; }
    #enter { padding: 12px; border: 1px solid #171717; border-radius: 0; cursor: pointer; font: inherit; background: #171717; color: #fff; }
    #enter:disabled { background: #ededed; border-color: #ededed; color: #737373; cursor: default; }
    #welcome { max-width: 304px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Game CAPTCHA</h1>
  <div id="captcha"></div>
  <button id="enter" type="button" disabled></button>
  <p id="welcome" hidden></p>
  <script type="module">
    import { createCaptcha, createTranslator, resolveLocale } from '../lib/game-captcha.js';
    const locale = resolveLocale();
    const t = createTranslator(locale);
    document.documentElement.lang = locale;
    const button = document.querySelector('#enter');
    const welcome = document.querySelector('#welcome');
    button.textContent = t('enter');
    welcome.textContent = t('entered');
    const gate = createCaptcha('#captcha', {
      game: '2048',
      targetScore: 128,
      locale,
      onStateChange({ state }) {
        button.disabled = state !== 'passed';
        if (state !== 'passed') welcome.hidden = true;
      },
    });
    button.addEventListener('click', () => { if (gate.getSnapshot().state === 'passed') welcome.hidden = false; });
    window.addEventListener('pagehide', () => gate.pause());
    window.addEventListener('pageshow', () => gate.resume());
  </script>
</body>
</html>
