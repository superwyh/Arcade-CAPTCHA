<div class="auth-layout">
    <section id="login-panel" class="auth-card" aria-labelledby="login-title">
      <h2 id="login-title" data-copy="login">Sign in</h2>
      <form id="login-form">
        <label for="email" data-copy="email">Email</label>
        <input id="email" type="email" value="demo@example.com" autocomplete="username" spellcheck="false" required />
        <label for="password" data-copy="password">Password</label>
        <div class="password-field">
          <input id="password" type="password" value="arcade-captcha" autocomplete="current-password" required />
          <button id="toggle-password" type="button" aria-pressed="false" aria-controls="password" data-copy="show">Show</button>
        </div>
        <button id="login-button" class="primary-button" type="submit" disabled data-copy="login">Sign in</button>
      </form>
    </section>
    <section id="account-panel" class="auth-card account-card" aria-labelledby="account-title" hidden>
      <span class="success-mark" aria-hidden="true">✓</span>
      <h2 id="account-title" data-copy="success">Signed in</h2>
      <p id="account-email"></p>
      <button id="logout-button" class="primary-button" type="button" data-copy="logout">Sign out</button>
    </section>
  </div>
  <dialog id="verification-dialog" class="verification-dialog" aria-labelledby="verification-title">
    <h2 id="verification-title" hidden>Game verification</h2>
    <div id="login-captcha"></div>
    <button id="close-dialog" class="close-button" type="button" aria-label="Close">×</button>
  </dialog>
